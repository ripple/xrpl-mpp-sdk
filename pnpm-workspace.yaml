# Overrides live here rather than in package.json: pnpm 11 stopped reading
# them from package.json, and would have dropped both of these silently on
# the next `packageManager` bump. This file is read by pnpm 10 and 11 alike.
overrides:
  esbuild: '>=0.28.1 <0.29.0'
  qs: '>=6.16.0'
  # A floor, not a pin. mppx declares this as an optional peer at `>=1.25.0`,
  # and under mppx 0.9.2 a copy carrying five advisories ended up in the tree.
  # mppx 0.15 no longer pulls it, verified on a clean install, so this installs
  # nothing today. It stays because it costs nothing while the package is absent
  # and bounds the version if it ever returns. Overrides apply to this
  # repository's own tree only, never to a consumer's.
  '@modelcontextprotocol/sdk': '>=1.32.0'
